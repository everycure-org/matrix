_pandas_parquet: &_pandas_parquet
  type: pandas.ParquetDataset
  load_args:
    engine: pyarrow
  save_args:
    engine: pyarrow


# -------------------------------------------------------------------------
# Primary
# -------------------------------------------------------------------------

primary.disease_list_patched_new_categories:
  <<: [*_pandas_parquet]
  filepath: ${globals:paths.primary}/disease_list_patched_new_categories.parquet

primary.disease_categories_new:
  <<: [*_pandas_parquet]
  filepath: ${globals:paths.primary}/disease_categories_new.parquet

primary.disease_list_patched_new_umn:
  <<: [*_pandas_parquet]
  filepath: ${globals:paths.primary}/disease_list_patched_new_umn.parquet

primary.disease_umn_new:
  <<: [*_pandas_parquet]
  filepath: ${globals:paths.primary}/disease_umn_new.parquet

# -------------------------------------------------------------------------
# Release
# -------------------------------------------------------------------------

primary.release.disease_categories:
  <<: [*_pandas_parquet]
  filepath: ${globals:paths.release}/disease_categories.parquet

primary.release.disease_umn:
  <<: [*_pandas_parquet]
  filepath: ${globals:paths.release}/disease_umn.parquet

primary.release.disease_txgnn:
  <<: [*_pandas_parquet]
  filepath: ${globals:paths.release}/disease_txgnn.parquet
